<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password · 4EVER FORWARD</title>
<style>body{font-family:system-ui;margin:0;background:#f6f6f2;color:#171717}.card{max-width:520px;margin:10vh auto;background:#fff;padding:28px;border-radius:22px;border:1px solid #ddd}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:11px;font:inherit}input{border:1px solid #bbb;margin:8px 0}button{border:0;background:#111;color:#fff;font-weight:900;margin-top:8px}.msg{margin-top:12px;font-size:14px;line-height:1.5}</style>
<div class="card"><h1>Reset password</h1><p>Choose a new password with at least 10 characters.</p><input id="p1" type="password" minlength="10" autocomplete="new-password" placeholder="New password"><input id="p2" type="password" minlength="10" autocomplete="new-password" placeholder="Confirm password"><button id="go">RESET PASSWORD</button><div class="msg" id="msg"></div><p><a href="/">Back to 4EVER FORWARD</a></p></div>
<script>const token=new URLSearchParams(location.search).get('token')||'';document.getElementById('go').onclick=async()=>{const m=document.getElementById('msg'),a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length<10){m.textContent='Use at least 10 characters.';return}if(a!==b){m.textContent='Passwords do not match.';return}const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:a})});let d={};try{d=await r.json()}catch(e){}m.textContent=r.ok?'Password reset. You can sign in now.':(typeof d.detail==='string'?d.detail:'Reset failed.');if(r.ok)document.getElementById('go').disabled=true};</script>
